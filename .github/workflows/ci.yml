name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Slow exhaustive tests (release)
        run: cargo test --workspace --release -- --ignored

  # Benchmarks the previous commit and this one back to back on the same
  # machine (shared CI runners vary too much to compare against stored
  # numbers), then fails if anything got more than 10% slower.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark the previous commit
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE:crates/poker-core/benches" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/base" "$BASE"
            cd "$RUNNER_TEMP/base"
            # Name each benchmark file explicitly: older commits don't mark the
            # library `bench = false`, and its test harness rejects Criterion's flags.
            targets=$(for f in crates/poker-core/benches/*.rs; do printf -- '--bench %s ' "$(basename "$f" .rs)"; done)
            # A separate target folder: sharing one lets cargo reuse the old
            # commit's build for the new code (its files look newer).
            CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
              cargo bench -p poker-core $targets -- --save-baseline base --warm-up-time 1 --measurement-time 3
            # Hand the saved baseline to this commit's run.
            mkdir -p "$GITHUB_WORKSPACE/target"
            cp -r "$RUNNER_TEMP/base-target/criterion" "$GITHUB_WORKSPACE/target/"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No earlier commit with benchmarks; nothing to compare against."
          fi
      - name: Benchmark this commit against it
        if: steps.base.outputs.found == 'true'
        run: cargo bench -p poker-core --benches -- --baseline-lenient base --warm-up-time 1 --measurement-time 3
      - name: Fail on a slowdown over 10%
        if: steps.base.outputs.found == 'true'
        run: python3 scripts/bench_gate.py target/criterion 0.10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The app embeds the Rust core as WebAssembly, so it needs Rust and wasm-pack.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build
