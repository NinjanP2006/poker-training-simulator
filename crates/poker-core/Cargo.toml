[package]
name = "poker-core"
version = "0.1.0"
edition = "2024"

[lib]
# Benchmarks live in benches/ (Criterion). Without this, `cargo bench` also
# runs the library's unit tests in bench mode, which reject Criterion's flags.
bench = false

[dependencies]
rand_chacha = "0.10.0"
web-time = "1.1.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "equity"
harness = false
