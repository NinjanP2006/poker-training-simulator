[package]
name = "poker-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
poker-core = { path = "../poker-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
web-time = "1.1.0"

[dev-dependencies]
serde_json = "1.0.154"
